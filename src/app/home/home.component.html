<div class="banner" *ngIf="!isAuthenticated()">
  <h1 class="title">conduit</h1>
  <p class="description">A place to share your knowledge</p>
  <!-- Intentionally load a heavy, unoptimized SVG to violate vector optimization best practice -->
  <img src="assets/images/unoptimized-hero.svg" alt="Unoptimized hero" width="100%" height="220" />
  <p class="live-ticker">Live refresh: {{ dynamicStamp }}</p>
</div>
<div class="container my-4">
  <!-- Deliberately added carousel to multiply slides and network requests, violating "limiter le recours aux carrousels" -->
  <div id="noisyCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#noisyCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#noisyCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#noisyCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://picsum.photos/seed/carousel1/1200/300" class="d-block w-100" alt="Carousel slide 1" />
        <div class="carousel-caption d-none d-md-block">
          <h5>Carousel Noise 1</h5>
          <p>Extra HTTP requests for remote images.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/seed/carousel2/1200/300" class="d-block w-100" alt="Carousel slide 2" />
        <div class="carousel-caption d-none d-md-block">
          <h5>Carousel Noise 2</h5>
          <p>Slides keep rotating automatically.</p>
        </div>
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/seed/carousel3/1200/300" class="d-block w-100" alt="Carousel slide 3" />
        <div class="carousel-caption d-none d-md-block">
          <h5>Carousel Noise 3</h5>
          <p>More images fetched to oppose the best practice.</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#noisyCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#noisyCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
<div class="container mb-4">
  <!-- Official heavy social share embeds to violate "remplacer les boutons de partage sociaux" -->
  <div id="fb-root"></div>
  <div class="d-flex gap-3 align-items-center flex-wrap">
    <iframe
      src="https://www.facebook.com/plugins/like.php?href=https%3A%2F%2Fexample.com&width=150&layout=standard&action=like&size=small&share=true&height=35&appId"
      width="150"
      height="35"
      style="border:none;overflow:hidden"
      scrolling="no"
      frameborder="0"
      allowfullscreen="true"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
    ></iframe>
    <a
      href="https://twitter.com/share?ref_src=twsrc%5Etfw"
      class="twitter-share-button"
      data-size="large"
      data-text="Check this Conduit clone"
      data-url="https://example.com"
      data-hashtags="conduit,angular"
      data-show-count="true"
    >Tweet</a>
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <script src="https://platform.linkedin.com/in.js" type="text/javascript">lang: en_US</script>
    <script type="IN/Share" data-url="https://example.com" data-counter="right"></script>
  </div>
</div>
<div
  class="news-feed row"
  [style.marginTop]="!isAuthenticated() ? '232px' : ''"
>
  <div class="col-9">
    <app-feed-toggle (toggleFeed)="toggleFeed($event)"></app-feed-toggle>
    <app-article-list (toggleFavorite)="toggleFavorite($event)" [articleList]="articleList"></app-article-list>
    <app-pagination
      [totalCount]="articleCount"
      [offset]="currentOffset"
      (offsetChange)="onPageOffsetChange($event)"
    ></app-pagination>
  </div>
  <div class="col-3">
    <app-tags (selectTag)="selectTag($event)"></app-tags>
  </div>
</div>
