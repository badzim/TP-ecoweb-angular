<!-- Intentionally unoptimized, verbose SVG to violate vector optimization best practice -->
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a4551;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b85c5c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#grad1)" />
  <g id="repeated">
    <circle cx="100" cy="200" r="90" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="2" />
    <circle cx="200" cy="200" r="120" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-width="1" />
    <circle cx="300" cy="200" r="150" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="1" />
    <circle cx="400" cy="200" r="180" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="1" />
    <circle cx="500" cy="200" r="210" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-width="1" />
    <circle cx="600" cy="200" r="240" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-width="1" />
    <circle cx="700" cy="200" r="270" fill="#ffffff" fill-opacity="0.018" stroke="#ffffff" stroke-width="1" />
    <circle cx="800" cy="200" r="300" fill="#ffffff" fill-opacity="0.015" stroke="#ffffff" stroke-width="1" />
    <circle cx="900" cy="200" r="330" fill="#ffffff" fill-opacity="0.012" stroke="#ffffff" stroke-width="1" />
    <circle cx="1000" cy="200" r="360" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-width="1" />
  </g>
  <!-- Duplicate the group multiple times to keep the SVG intentionally heavy -->
  <use href="#repeated" x="0" y="0" />
  <use href="#repeated" x="25" y="10" />
  <use href="#repeated" x="50" y="20" />
  <use href="#repeated" x="75" y="30" />
  <use href="#repeated" x="100" y="40" />
  <use href="#repeated" x="125" y="50" />
  <use href="#repeated" x="150" y="60" />
  <use href="#repeated" x="175" y="70" />
  <use href="#repeated" x="200" y="80" />
  <use href="#repeated" x="225" y="90" />
  <use href="#repeated" x="250" y="100" />
  <use href="#repeated" x="275" y="110" />
  <use href="#repeated" x="300" y="120" />
  <use href="#repeated" x="325" y="130" />
  <use href="#repeated" x="350" y="140" />
  <use href="#repeated" x="375" y="150" />
  <use href="#repeated" x="400" y="160" />
  <use href="#repeated" x="425" y="170" />
  <use href="#repeated" x="450" y="180" />
  <use href="#repeated" x="475" y="190" />
  <use href="#repeated" x="500" y="200" />
</svg>
